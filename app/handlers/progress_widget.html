<style>
  * {box-sizing:border-box}
  .tracker {color:#35231e;padding:5px 4px 3px;font-family:system-ui,sans-serif}
  .top {display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .eyebrow {color:#a44b35;font-size:.72em;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
  .heading {margin:2px 0 0;font-size:1.3em;font-weight:780;line-height:1.15}
  .period {flex:none;margin-top:1px;padding:5px 9px;border-radius:999px;background:#f7ebe5;color:#825344;font-size:.72em;font-weight:650}
  .score {display:flex;align-items:baseline;gap:5px;margin:17px 0 3px}
  .score strong {color:#a34832;font-size:2.35em;line-height:.9;letter-spacing:-.05em}
  .score span {color:#8a6b60;font-size:.86em}
  .progress {height:5px;margin:9px 0 18px;overflow:hidden;border-radius:99px;background:#f0dfd7}
  .progress i {display:block;width:{{week_percent}}%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#bf6248,#963e2a);transition:width .35s ease}
  .week {display:flex;justify-content:space-between;gap:3px;text-align:center}
  .weekday {appearance:none;-webkit-appearance:none;display:flex;flex:1;min-width:0;align-items:center;flex-direction:column;padding:0;border:0;background:transparent;color:#795e54;font:inherit}
  .label,.date {font-size:.68em;font-weight:650}
  .date {margin-top:5px;color:#9b8177;font-weight:550}
  .mark {display:grid;width:29px;height:29px;margin-top:6px;place-items:center;border:1.5px solid #d9c6bd;border-radius:50%;background:#fff;color:#fff;font-size:.84em;font-weight:800;transition:transform .18s ease}
  .done .mark {border-color:#a34832;background:#a34832;box-shadow:0 3px 9px #a3483238;animation:appear .32s ease-out}
  .today .mark {border-color:#a34832;box-shadow:0 0 0 3px #f4ded4}
  .today .label,.today .date {color:#963e2a;font-weight:750}
  .future {opacity:.48}
  .weekday:active .mark {transform:scale(.9)}
  .bottom {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px;padding:11px 12px;border-radius:11px;background:#fbf3ef}
  .record {color:#7a5b50;font-size:.75em}
  .record strong {display:block;margin-top:1px;color:#442c24;font-size:1.15em}
  .detail {max-width:52%;color:#a34832;font-size:.72em;font-weight:650;text-align:right}
  @keyframes appear {from {transform:scale(.65);opacity:.25} to {transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce) {.done .mark {animation:none}.progress i {transition:none}}
</style>
<div class="tracker">
  <div class="top">
    <div><div class="eyebrow">YogaDailyBot</div><div class="heading">Твоя неделя</div></div>
    <div class="period">{{dates}}</div>
  </div>
  <div class="score"><strong>{{week_done}}</strong><span>из 7 дней с практикой</span></div>
  <div class="progress"><i></i></div>
  <div class="week">{{week}}</div>
  <div class="bottom">
    <div class="record">Лучшая серия<strong>{{best}}</strong></div>
    <div class="detail" id="day" aria-live="polite">Нажми на день</div>
  </div>
</div>
<script>
  const widget = window.TelegramWidget;
  document.querySelectorAll('.weekday').forEach((cell) => {
    cell.addEventListener('click', () => {
      const label = cell.querySelector('.label').textContent;
      const status = cell.classList.contains('done') ? 'практика выполнена'
        : cell.classList.contains('future') ? 'день ещё впереди' : 'практика не отмечена';
      document.getElementById('day').textContent = label + ': ' + status;
      if (widget && widget.HapticFeedback) widget.HapticFeedback.selectionChanged();
    });
  });
</script>
